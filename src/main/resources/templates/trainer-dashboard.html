<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Trainer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Trainer Dashboard
    </h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Students</h5>
                    <h2 th:text="${totalStudents}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Total Interviews</h5>
                    <h2 th:text="${totalInterviews}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h5>Average Score</h5>
                    <h2 th:text="${averageScore}">0</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4 text-center">

        <a href="/trainer/students" class="btn btn-primary">
            View Students
        </a>

        <a href="/trainer/logout" class="btn btn-danger ms-2">
            Logout
        </a>

    </div>

    <hr class="mt-5">

    <h3>🏆 Top Performers</h3>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">
        <tr>
            <th>Student Name</th>
            <th>Score</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="result : ${topPerformers}">
            <td th:text="${result.userName}"></td>
            <td th:text="${result.score}"></td>
        </tr>

        </tbody>

    </table>

    <h3 class="mt-5">🕒 Recent Interviews</h3>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th>Email</th>
            <th>Category</th>
            <th>Score</th>
            <th>Date</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="result : ${recentInterviews}">
            <td th:text="${result.userEmail}"></td>
            <td th:text="${result.category}"></td>
            <td th:text="${result.score}"></td>
            <td th:text="${result.interviewDate}"></td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
