<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Interview Questions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body class="dashboard-page">

<div class="container py-5">

    <div class="glass-card p-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold text-white">
                AI Interview Test
            </h2>

            <h4 class="text-warning">
                ⏱ Time Left: <span id="timer">30:00</span>
            </h4>
            <div class="progress mt-3 mb-4" style="height:10px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                     style="width:100%">
                </div>
            </div>
            <h6 class="text-info mb-4">
                Total Questions :
                <span th:text="${questions.size()}"></span>
            </h6>

        </div>

        <form action="/submit" method="post">

            <input type="hidden"
                   name="category"
                   th:value="${questions[0].category}">

            <div th:each="q,qStat : ${questions}"
                 class="question-box mb-5">

                <h4 class="question-title">

                    Q<span th:text="${qStat.count}"></span>.

                    <span th:text="${q.questionText}"></span>

                </h4>

                <div class="form-check option-box">

                    <input class="form-check-input"
                           type="radio"
                           th:id="${'q'+q.id+'1'}"
                           th:name="${'q'+q.id}"
                           th:value="${q.option1}">

                    <label class="form-check-label"
                           th:for="${'q'+q.id+'1'}"
                           th:text="${q.option1}"></label>

                </div>

                <div class="form-check option-box">

                    <input class="form-check-input"
                           type="radio"
                           th:id="${'q'+q.id+'2'}"
                           th:name="${'q'+q.id}"
                           th:value="${q.option2}">

                    <label class="form-check-label"
                           th:for="${'q'+q.id+'2'}"
                           th:text="${q.option2}"></label>
                </div>

                <div class="form-check option-box">

                    <input class="form-check-input"
                           type="radio"
                           th:id="${'q'+q.id+'3'}"
                           th:name="${'q'+q.id}"
                           th:value="${q.option3}">

                    <label class="form-check-label"
                           th:for="${'q'+q.id+'3'}"
                           th:text="${q.option3}"></label>

                </div>

                <div class="form-check option-box">

                    <input class="form-check-input"
                           type="radio"
                           th:id="${'q'+q.id+'4'}"
                           th:name="${'q'+q.id}"
                           th:value="${q.option4}">

                    <label class="form-check-label"
                           th:for="${'q'+q.id+'4'}"
                           th:text="${q.option4}"></label>

                </div>

            </div>

            <button type="submit"
                    class="btn btn-warning btn-lg w-100 shadow">

                🚀 Submit Interview

            </button>

        </form>

    </div>

</div>
<script>
    let timeLeft = 1800;

    let timer = setInterval(function () {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("timer").innerHTML =
            minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

        timeLeft--;

        if (timeLeft < 0) {

            clearInterval(timer);

            alert("Time Over!");

            document.forms[0].submit();

        }

    }, 1000);
</script>
</body>
</html>
