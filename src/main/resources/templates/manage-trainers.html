<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Manage Trainers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>Manage Trainers</h2>

    <form action="/admin/trainers/save" method="post">

        <input
                type="text"
                name="name"
                placeholder="Trainer Name"
                class="form-control mb-2">

        <input
                type="email"
                name="email"
                placeholder="Email"
                class="form-control mb-2">

        <input
                type="password"
                name="password"
                placeholder="Password"
                class="form-control mb-2">

        <input
                type="text"
                name="mobile"
                placeholder="Mobile"
                class="form-control mb-2">

        <input
                type="text"
                name="department"
                placeholder="Department"
                class="form-control mb-2">

        <button class="btn btn-success">

            Save Trainer

        </button>

    </form>

    <hr>

    <table class="table table-bordered">

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Department</th>

        </tr>

        <tr th:each="t:${trainers}">

            <td th:text="${t.id}"></td>

            <td th:text="${t.name}"></td>

            <td th:text="${t.email}"></td>

            <td th:text="${t.department}"></td>

        </tr>

    </table>

</div>

</body>
</html>
