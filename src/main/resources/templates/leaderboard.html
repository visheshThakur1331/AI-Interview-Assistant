<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-dark">

<div class="container py-5">

    <div class="glass-card p-5">

        <h1 class="text-center text-warning mb-5">

            🏆 Top Performers

        </h1>

        <table class="table table-dark table-hover align-middle">

            <thead>

            <tr>

                <th>Rank</th>

                <th>Student</th>

                <th>Category</th>

                <th>Score</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="item,stat : ${leaders}">

                <td>

                    <span th:if="${stat.index==0}" class="badge bg-warning text-dark fs-6">🥇 1</span>

                    <span th:if="${stat.index==1}" class="badge bg-secondary fs-6">🥈 2</span>

                    <span th:if="${stat.index==2}" class="badge bg-danger fs-6">🥉 3</span>

                    <span th:if="${stat.index>2}" th:text="${stat.index+1}"></span>

                </td>

                <td>
                    <b th:text="${item.userName}"></b><br>
                    <small th:text="${item.userEmail}"></small>
                </td>

                <td th:text="${item.category}"></td>

                <td>

                    <span class="badge bg-success fs-6"
                          th:text="${item.score + ' / ' + item.total}">
                     </span>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="text-center mt-4">

            <a href="/dashboard"

               class="btn btn-primary btn-lg">

                <i class="bi bi-arrow-left-circle"></i>

                Back Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
