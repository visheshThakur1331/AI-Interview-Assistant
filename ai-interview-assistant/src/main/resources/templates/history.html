<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Interview History</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-dark">

<div class="container py-5">

    <div class="glass-card p-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-white">

                <i class="bi bi-clock-history text-warning"></i>

                Interview History

            </h2>

            <input type="text"
                   id="searchInput"
                   class="form-control w-25"
                   placeholder="Search Category">

        </div>

        <table class="table table-dark table-hover align-middle" id="historyTable">

            <thead>

            <tr>

                <th>Category</th>

                <th>Score</th>

                <th>Total</th>

                <th>Date</th>

                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="history : ${historyList}">

                <td th:text="${history.category}"></td>

                <td>

                    <span class="badge bg-primary"

                          th:text="${history.score}">

                    </span>

                </td>

                <td th:text="${history.total}"></td>

                <td th:text="${#temporals.format(history.interviewDate,'dd MMM yyyy HH:mm')}"></td>

                <td>

                    <span class="badge bg-success"

                          th:if="${history.score>=history.total*0.8}">

                        Excellent
                    </span>

                    <span class="badge bg-warning text-dark"

                          th:if="${history.score>=history.total*0.5 && history.score<history.total*0.8}">

                        Good
                    </span>

                    <span class="badge bg-danger"

                          th:if="${history.score<history.total*0.5}">

                        Need Practice
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="text-center mt-4">

            <a href="/dashboard"
               class="btn btn-primary btn-lg">

                <i class="bi bi-arrow-left-circle"></i>

                Back Dashboard

            </a>

        </div>

    </div>

</div>

<script>

    const searchInput=document.getElementById("searchInput");

    searchInput.addEventListener("keyup",function(){

        let filter=searchInput.value.toUpperCase();

        let table=document.getElementById("historyTable");

        let tr=table.getElementsByTagName("tr");

        for(let i=1;i<tr.length;i++){

            let td=tr[i].getElementsByTagName("td")[0];

            if(td){

                let txt=td.textContent||td.innerText;

                tr[i].style.display=txt.toUpperCase().indexOf(filter)>-1?"":"none";

            }

        }

    });

</script>

</body>

</html>
