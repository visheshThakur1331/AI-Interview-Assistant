<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-dark">

<div class="container py-5">

    <div class="glass-card p-5">

        <div class="row">

            <div class="col-md-3 text-center">

                <div class="profile-avatar">

                    <i class="bi bi-person-circle"></i>

                </div>

                <h3 class="mt-3" th:text="${session.userName}"></h3>

                <p class="text-secondary">

                    AI Interview Candidate

                </p>

            </div>

            <div class="col-md-9">

                <h2 class="mb-4">

                    <i class="bi bi-person-vcard-fill text-primary"></i>

                    My Profile

                </h2>

                <table class="table table-dark table-borderless">

                    <tr>

                        <td width="220">

                            <i class="bi bi-envelope-fill text-info"></i>

                            Email

                        </td>

                        <td th:text="${email}"></td>

                    </tr>

                    <tr>

                        <td>

                            <i class="bi bi-trophy-fill text-warning"></i>

                            Best Score

                        </td>

                        <td th:text="${bestScore}"></td>

                    </tr>

                    <tr>

                        <td>

                            <i class="bi bi-bar-chart-fill text-success"></i>

                            Total Interviews

                        </td>

                        <td th:text="${totalInterviews}"></td>

                    </tr>

                    <tr>

                        <td>

                            <i class="bi bi-graph-up-arrow text-primary"></i>

                            Average Score

                        </td>

                        <td th:text="${averageScore}"></td>

                    </tr>

                    <tr>

                        <td>

                            <i class="bi bi-file-earmark-code-fill text-warning"></i>

                            Latest Category

                        </td>

                        <td th:text="${latestCategory}"></td>

                    </tr>

                    <tr>

                        <td>

                            <i class="bi bi-calendar-event-fill text-danger"></i>

                            Latest Interview

                        </td>

                        <td th:text="${latestDate}"></td>

                    </tr>

                </table>

                <a href="/dashboard" class="btn btn-primary mt-3">

                    <i class="bi bi-arrow-left-circle"></i>

                    Back Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
