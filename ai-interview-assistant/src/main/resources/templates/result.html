<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Interview Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dashboard-page">

<div class="container py-5">

    <div class="result-card text-center">

        <h1 class="text-success mb-4">
            🎉 Interview Completed
        </h1>

        <div class="score-circle">

            <div class="score-value">

                <span th:text="${score}"></span>

                /

                <span th:text="${total}"></span>

            </div>

            <small>Final Score</small>

        </div>

        <div class="mt-4">

            <h3 class="text-warning">
                <span th:text="${feedback}"></span>
            </h3>
            <div class="badge-result">

                🏆 Excellent

            </div>

            <div class="mt-3">

    <span class="badge-result"
          th:text="${badge}">
    </span>

            </div>
        </div>

        <div class="recommend-card mt-4">

            <h4>🤖 AI Recommendation</h4>

            <p th:text="${recommendation}"></p>

        </div>

        <div class="mt-5">

            <a href="/dashboard"
               class="btn btn-primary btn-lg me-3">

                🏠 Dashboard

            </a>

            <a href="/history"
               class="btn btn-dark btn-lg me-3">

                📜 History

            </a>

            <a href="/leaderboard"
               class="btn btn-warning btn-lg">

                🏆 Leaderboard

            </a>

        </div>

    </div>

</div>

</body>
</html>
